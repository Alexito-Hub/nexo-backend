name: nexo-backend

services:
  # API. Los datos reales viven en MongoDB Atlas: aquí no se levanta ningún
  # motor de base de datos para producción.
  api:
    build:
      context: .
    image: nexo-backend:latest
    restart: unless-stopped
    ports:
      - "${PORT:-4000}:4000"
    environment:
      # Si falta alguna, el arranque falla con un mensaje explícito
      # (ver `config/runtime.exs`): mejor no levantar el servicio que
      # levantarlo con valores por defecto inseguros.
      MONGODB_URI: ${MONGODB_URI:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-}
      SIGMA_BASE_URL: ${SIGMA_BASE_URL:-https://sigma.upla.edu.pe/api}
      AUTHORIZED_TEACHERS: ${AUTHORIZED_TEACHERS:-}
      PHX_HOST: ${PHX_HOST:-localhost}
      PHX_SERVER: "true"
      PORT: "4000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
