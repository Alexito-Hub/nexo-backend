name: nexo-backend

services:
  api:
    build:
      context: .
    image: nexo-backend:latest
    restart: unless-stopped
    ports:
      - "${PORT:-4000}:4000"
    environment:
      # MongoDB Atlas gestiona la base: no se levanta ningún motor local.
      MONGODB_URI: ${MONGODB_URI:?define MONGODB_URI en .env}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?define ADMIN_API_KEY en .env}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?genera uno con "mix phx.gen.secret"}
      SIGMA_BASE_URL: ${SIGMA_BASE_URL:-https://sigma.upla.edu.pe/api}
      PHX_HOST: ${PHX_HOST:-localhost}
      PHX_SERVER: "true"
      PORT: "4000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
